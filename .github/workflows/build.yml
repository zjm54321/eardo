name: Package Application

on:
  workflow_dispatch: # 允许手动触发
    inputs:
      build_linux:
        description: 'Build for Linux'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build for Windows'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build for macOS'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  CARGO_TERM_COLOR: always
  LEPTOS_OUTPUT_NAME: eardo

jobs:
  package-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_linux == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      # 使用官方推荐的 install-from-binstall-release.sh 脚本安装 cargo-binstall
      # 然后使用 cargo binstall 安装 cargo-leptos，并传入 GITHUB_TOKEN
      - name: Install cargo-leptos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-leptos -y

      - name: Build App
        run: cargo leptos build --release

      - name: Create Distribution Package
        run: |
          mkdir -p dist
          cp target/release/server dist/
          cp -r target/site dist/site
          cp Cargo.toml dist/
          if [ -d "migrations" ]; then
            cp -r migrations dist/migrations
          fi
          chmod +x dist/server

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LEPTOS_OUTPUT_NAME }}-linux-package
          path: dist/
          if-no-files-found: error

  package-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      # Windows 上安装 cargo-binstall 的更稳健方法：
      # 使用 PowerShell 下载并将其放入 Cargo 的 bin 目录（该目录通常在 PATH 中）
      - name: Install cargo-leptos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $url = "https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile "cargo-binstall.zip"
          Expand-Archive -Path "cargo-binstall.zip" -DestinationPath "."
          
          # 获取 cargo bin 目录
          $cargoBin = "${env:USERPROFILE}\.cargo\bin"
          if (-not (Test-Path $cargoBin)) { New-Item -ItemType Directory -Force -Path $cargoBin }
          
          # 移动并覆盖
          Move-Item -Path "cargo-binstall.exe" -Destination "$cargoBin\" -Force
          
          # 验证安装
          cargo binstall --version
          
          # 使用 binstall 安装 leptos
          cargo binstall cargo-leptos -y

      - name: Build App
        run: cargo leptos build --release

      - name: Create Distribution Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          # Windows 二进制有 .exe 后缀
          Copy-Item -Path "target\release\server.exe" -Destination dist\
          Copy-Item -Recurse -Path "target\site" -Destination dist\site
          Copy-Item -Path "Cargo.toml" -Destination dist\
          if (Test-Path "migrations") {
            Copy-Item -Recurse -Path "migrations" -Destination dist\migrations
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LEPTOS_OUTPUT_NAME }}-windows-package
          path: dist/
          if-no-files-found: error

  package-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      # macOS 修复：使用 GITHUB_TOKEN
      - name: Install cargo-leptos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 安装 cargo-binstall
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          
          # 使用 binstall 安装 cargo-leptos，此时有了 Token 就不会 403 了
          cargo binstall cargo-leptos -y

      - name: Build App
        run: cargo leptos build --release

      - name: Create Distribution Package
        run: |
          mkdir -p dist
          cp target/release/server dist/
          cp -r target/site dist/site
          cp Cargo.toml dist/
          if [ -d "migrations" ]; then
            cp -r migrations dist/migrations
          fi
          chmod +x dist/server

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LEPTOS_OUTPUT_NAME }}-macos-package
          path: dist/
          if-no-files-found: error

  deploy-production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.LEPTOS_OUTPUT_NAME }}-linux-package
          path: dist

      - name: Create release archive
        run: |
          tar -czf eardo-${GITHUB_SHA}.tar.gz -C dist .

      - name: Upload release archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: eardo-${{ github.sha }}.tar.gz
          target: /tmp
          overwrite: true

      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_ID: ${{ github.sha }}
          RELEASE_ARCHIVE: eardo-${{ github.sha }}.tar.gz
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: RELEASE_ID,RELEASE_ARCHIVE
          script: |
            set -euo pipefail

            APP_ROOT="/opt/eardo"
            RELEASES_DIR="$APP_ROOT/releases"
            RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"
            CURRENT_LINK="$APP_ROOT/current"
            ARCHIVE_PATH="/tmp/$RELEASE_ARCHIVE"

            mkdir -p "$RELEASES_DIR"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

            tar -xzf "$ARCHIVE_PATH" -C "$RELEASE_DIR"

            test -f "$RELEASE_DIR/server"
            test -d "$RELEASE_DIR/site"

            chmod +x "$RELEASE_DIR/server"
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            sudo -n systemctl daemon-reload
            sudo -n systemctl restart eardo
            sudo -n systemctl is-active --quiet eardo
            sudo -n systemctl status eardo --no-pager

            rm -f "$ARCHIVE_PATH"
